<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>D.I.S.C.O</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>D.I.S.C.O</h1>
    <p>MOBILE EDITION</p>
</header>

<div class="core">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="center"></div>
</div>

<p class="core-text">CORE ACTIVE</p>

<div class="status">

    <h2>SYSTEM STATUS</h2>

    <div class="row">
        <span>AI CORE</span>
        <b class="on">● ONLINE</b>
    </div>

    <div class="row">
        <span>NETWORK</span>
        <b class="on">● ONLINE</b>
    </div>

    <div class="row">
        <span>VOICE</span>
        <b class="off">● LOCKED</b>
    </div>

    <div class="row">
        <span>MEMORY</span>
        <b class="off">● LOCKED</b>
    </div>

</div>

<div class="chat" id="chat">
    <p><strong>D.I.S.C.O:</strong> Systems online. How may I assist you, Boss?</p>
</div>

<div class="input-area">

    <input
        id="msg"
        type="text"
        placeholder="Ask D.I.S.C.O..."
    >

    <button id="mic">🎙️</button>

    <button id="send">SEND</button>

</div>
<script src="script.js"></script>

</body>
</html>
